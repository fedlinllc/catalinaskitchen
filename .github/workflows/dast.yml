name: DAST

on:
  schedule:
    - cron: '45 3 * * *'   # 03:45 UTC nightly
  workflow_dispatch:
    inputs:
      target:
        description: Target URL to scan
        required: false
        default: https://www.catalinaskitchen.com

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan (DAST)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target || 'https://www.catalinaskitchen.com' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          artifact_name: zap-report
          fail_action: warn

      - name: Upload ZAP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: zap-dast
